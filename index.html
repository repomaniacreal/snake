<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Snake</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    color: #eee;
    font-family: system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 16px;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  h1 { font-size: 1.4rem; margin-bottom: 8px; }
  #score { font-size: 1.1rem; margin-bottom: 10px; color: #ffd166; }
  #game {
    background: #16213e;
    border: 3px solid #0f3460;
    border-radius: 10px;
    max-width: 100%;
    display: block;
  }
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.75);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    z-index: 10;
  }
  #overlay.hidden { display: none; }
  #overlay h2 { font-size: 1.8rem; }
  #overlay p { color: #aaa; }
  button {
    background: #e94560;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 12px 32px;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
  }
  button:active { transform: scale(.96); }
  .hint { margin-top: 10px; font-size: .8rem; color: #777; text-align: center; }
</style>
</head>
<body>
  <h1>🐍 Snake</h1>
  <div id="score">Score: 0</div>
  <canvas id="game" width="400" height="400"></canvas>
  <div class="hint">Swipe / arrow keys / WASD to move</div>

  <div id="overlay" class="hidden">
    <h2 id="overlayTitle">Game Over</h2>
    <p id="finalScore">Score: 0</p>
    <button id="restartBtn">Play Again</button>
  </div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlayTitle');
const finalScore = document.getElementById('finalScore');
const restartBtn = document.getElementById('restartBtn');

const BOX = 20;
const COLS = canvas.width / BOX;
const ROWS = canvas.height / BOX;

let snake, dir, nextDir, food, score, gameLoop, speed;

function reset() {
  snake = [{x: 10, y: 10}];
  dir = {x: 1, y: 0};
  nextDir = {x: 1, y: 0};
  score = 0;
  speed = 130;
  scoreEl.textContent = 'Score: 0';
  placeFood();
  overlay.classList.add('hidden');
}

function placeFood() {
  food = {
    x: Math.floor(Math.random() * COLS),
    y: Math.floor(Math.random() * ROWS)
  };
  // don't place food on the snake's body
  if (snake.some(s => s.x === food.x && s.y === food.y)) placeFood();
}

function step() {
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  // hitting a wall or your own body = game over
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS ||
      snake.some(s => s.x === head.x && s.y === head.y)) {
    return gameOver();
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score += 10;
    scoreEl.textContent = 'Score: ' + score;
    placeFood();
    // speed up a little with each meal
    if (speed > 60) {
      speed -= 4;
      clearInterval(gameLoop);
      gameLoop = setInterval(step, speed);
    }
  } else {
    snake.pop();
  }

  draw();
}

function draw() {
  ctx.fillStyle = '#16213e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // food
  ctx.fillStyle = '#e94560';
  ctx.beginPath();
  ctx.arc(food.x * BOX + BOX/2, food.y * BOX + BOX/2, BOX/2 - 2, 0, Math.PI * 2);
  ctx.fill();

  // snake
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? '#06d6a0' : '#06d6a0aa';
    ctx.fillRect(s.x * BOX + 1, s.y * BOX + 1, BOX - 2, BOX - 2);
  });
}

function gameOver() {
  clearInterval(gameLoop);
  finalScore.textContent = 'Score: ' + score;
  overlayTitle.textContent = 'Game Over 💀';
  overlay.classList.remove('hidden');
}

function start() {
  reset();
  draw();
  clearInterval(gameLoop);
  gameLoop = setInterval(step, speed);
}

// keyboard controls
document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if ((k === 'arrowup' || k === 'w') && dir.y !== 1) nextDir = {x: 0, y: -1};
  else if ((k === 'arrowdown' || k === 's') && dir.y !== -1) nextDir = {x: 0, y: 1};
  else if ((k === 'arrowleft' || k === 'a') && dir.x !== 1) nextDir = {x: -1, y: 0};
  else if ((k === 'arrowright' || k === 'd') && dir.x !== -1) nextDir = {x: 1, y: 0};
  if (e.key.startsWith('Arrow')) e.preventDefault();
});

// touch controls (swipe)
let touchStart = null;
canvas.addEventListener('touchstart', e => {
  touchStart = {x: e.touches[0].clientX, y: e.touches[0].clientY};
}, {passive: true});

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!touchStart) return;
  const dx = e.touches[0].clientX - touchStart.x;
  const dy = e.touches[0].clientY - touchStart.y;
  if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
  if (Math.abs(dx) > Math.abs(dy)) {
    if (dx > 0 && dir.x !== -1) nextDir = {x: 1, y: 0};
    else if (dx < 0 && dir.x !== 1) nextDir = {x: -1, y: 0};
  } else {
    if (dy > 0 && dir.y !== -1) nextDir = {x: 0, y: 1};
    else if (dy < 0 && dir.y !== 1) nextDir = {x: 1, y: 0};
  }
  touchStart = {x: e.touches[0].clientX, y: e.touches[0].clientY};
}, {passive: false});

restartBtn.addEventListener('click', start);

start();
</script>
</body>
</html>
